      channel_handling: grayscale repeated to 3 channels
      resize: 224x224 Pillow BILINEAR
      scaling: multiply by 255; EfficientNetV2 preprocess_input is compatibility pass-through;
        EfficientNetV2S default include_preprocessing=True performs internal rescaling
      mean: N/A (application internal preprocessing, not external mean/std)
      std: N/A
      normalization_function: preprocess_for_efficientnet -> keras.applications.efficientnet_v2.preprocess_input;
        model includes preprocessing
      normalization_order: DICOM rescale/invert -> minmax -> resize -> RGB repeat
        -> training augmentation -> batch -> x255/preprocess_input -> MixUp -> model
      source_file: train_aura.py
      source_function: load_dicom_grayscale/load_dicom_rgb; preprocess_for_efficientnet;
        make_tf_dataset
    pretraining:
      identifier: weights="imagenet"
      include_top: false
      pooling: avg
      upstream_hash: UNRESOLVED_FROM_AVAILABLE_PROVENANCE
    head:
      base_output: pooled feature vector
      batchnorm_head: true
      dense_units:
      - 512
      - 256
      - 128
      - 64
      - 32
      l2: 5.0e-05
      dropout: 0.4
      per_dense_sequence:
      - Dense
      - BatchNormalization
      - ReLU
      - Dropout
      output: Dense(2,softmax,dtype=float32)
      bias: Keras Dense default True
      kernel_initializer: Keras Dense default GlorotUniform
    loss:
      type: CategoricalFocalCrossentropy
      alpha: 0.25
      alpha_source: Keras 3.13.2 effective default; code passes no alpha
      gamma: 2.0
      from_logits: false
      label_smoothing: 0.05
      reduction: sum_over_batch_size
      class_weight: balanced per inner-train fold via total/(2*n_class)
    augmentation:
    - model: EfficientNetV2S
      phase: all_training_phases
      order_index: 1
      augmentation: horizontal_flip
      enabled: true
      probability: 0.5
      parameter: left-right flip
      minimum: ''
      maximum: ''
      unit: boolean
      interpolation: tf.image
      fill_mode: N/A
      source: train_aura.py:_tf_augment
    - model: EfficientNetV2S
      phase: all_training_phases
      order_index: 2
      augmentation: random_brightness
      enabled: true
      probability: '1.0'
      parameter: additive delta
      minimum: -0.15
      maximum: 0.15
      unit: normalized intensity
      interpolation: tf.image
      fill_mode: N/A
      source: train_aura.py:_tf_augment
    - model: EfficientNetV2S
      phase: all_training_phases
      order_index: 3
      augmentation: random_contrast
      enabled: true
      probability: '1.0'
      parameter: contrast factor
      minimum: 0.85
      maximum: 1.15
      unit: multiplicative factor
      interpolation: tf.image
      fill_mode: N/A
      source: train_aura.py:_tf_augment
    - model: EfficientNetV2S
      phase: all_training_phases
      order_index: 4
      augmentation: clip
      enabled: true
      probability: '1.0'
      parameter: intensity
      minimum: 0
      maximum: 1
      unit: normalized intensity
      interpolation: tf.clip_by_value
      fill_mode: N/A
      source: train_aura.py:_tf_augment
    - model: EfficientNetV2S
      phase: all_training_phases
      order_index: 5
      augmentation: MixUp
      enabled: true
      probability: 1.0 per training batch
      parameter: lambda ~ Beta(alpha,alpha)
      minimum: 0.2
      maximum: 0.2
      unit: alpha; one scalar lambda per batch
      interpolation: linear interpolation
      fill_mode: paired by tf.random.shuffle
      source: train_aura.py:mixup_batch; make_tf_dataset
    training_phases:
    - model: EfficientNetV2S
      phase: phase1_initial
      backbone_frozen: true
