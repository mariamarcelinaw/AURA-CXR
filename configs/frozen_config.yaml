    - 45
    - 90
    - 135
    symmetric: true
    normed: true
    properties:
    - contrast
    - energy
    - homogeneity
    - dissimilarity
    - correlation
    - ASM
    quantization:
      method: per_subband_minmax_uint8
      constant_subband: zeros
      scale: 255
      clip:
      - 0
      - 255
      cast: uint8_truncation
    property_order:
    - contrast
    - energy
    - homogeneity
    - dissimilarity
    - correlation
    - ASM
