      weight_decay: None
      batch_size: 64
      max_epochs: 40
      scheduler: ReduceLROnPlateau(val_loss,factor=.5,patience=5,min_lr=1e-7)
      early_stopping_patience: 12
      monitor: val_auc
      mixed_precision: mixed_float16 enabled by run script
      gradient_clip: none
      source: train_aura.py; run_aura_cxr.sh
    - model: EfficientNetV2S
      phase: phase2_finetune
      backbone_frozen: false
